# ============================================================
# Forzee — XcodeGen Project Configuration
# Run `make generate` to regenerate the .xcodeproj from this file
# ============================================================

name: Forzee

options:
  bundleIdPrefix: com.forzee
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.forzee.app
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Forzee:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Skills/*.md are excluded from this glob and added below as a folder
      # reference instead — a plain glob entry would copy them flat into the
      # bundle root, losing the "Skills" subdirectory that
      # Bundle.main.urls(forResourcesWithExtension:subdirectory:) looks
      # under (see SkillLoader.swift).
      - path: Forzee
        excludes:
          - "Resources/Skills/**"
      - path: Forzee/Resources/Skills
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    entitlements:
      path: Forzee/Resources/Forzee.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.weatherkit: true
        aps-environment: development
    settings:
      base:
        INFOPLIST_FILE: Forzee/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    info:
      path: Forzee/Resources/Info.plist
      properties:
        CFBundleDisplayName: Forzee
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        NSHealthShareUsageDescription: "Forzee uses your health data to help Kai personalise your coaching."
        NSHealthUpdateUsageDescription: "Forzee logs your workouts to Apple Health."
        NSMicrophoneUsageDescription: "Forzee uses your microphone for voice conversations with Kai."
        NSSpeechRecognitionUsageDescription: "Forzee uses speech recognition so you can talk to Kai hands-free."
        NSCalendarsUsageDescription: "Forzee reads your calendar so Kai can plan workouts around your schedule."
        NSLocationWhenInUseUsageDescription: "Forzee uses your location to check the weather so Kai can route you indoors or outdoors."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Build settings from Secrets.xcconfig only reach Bundle.main.infoDictionary
        # if they're mirrored here — Xcode substitutes $(VAR) into the generated
        # Info.plist during the build, it doesn't expose xcconfig settings on its own.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        ELEVENLABS_API_KEY: $(ELEVENLABS_API_KEY)
        ELEVENLABS_VOICE_ID: $(ELEVENLABS_VOICE_ID)
    dependencies:
      - package: Supabase
      - package: RevenueCat

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
